[project]
name = "machine-learning-specialization"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rodrigo Costa", email = "rmcosta@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "ipympl>=0.10.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.6.2",
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pydot>=4.0.1",
    "scikit-learn>=1.9.0",
    "sympy>=1.14.0",
    "tensorflow>=2.21.0",
    "xgboost>=3.4.0",
]

[project.scripts]
machine-learning-specialization = "machine_learning_specialization:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
